<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MailerLiteTube</title>
<style>
:root{
  --bg:#fff;--fg:#0f0f0f;--fg2:#606060;--chip:#f2f2f2;--chipfg:#0f0f0f;
  --hover:#f2f2f2;--line:#e5e5e5;--field:#fff;--fieldline:#ccc;--shadow:rgba(0,0,0,.1);
  --btn:#f2f2f2;--btnfg:#0f0f0f;--sub:#0f0f0f;--subfg:#fff;--brand:#f03;
  --skel:#e9e9e9;
}
:root[data-theme="dark"]{
  --bg:#0f0f0f;--fg:#f1f1f1;--fg2:#aaa;--chip:#272727;--chipfg:#f1f1f1;
  --hover:#272727;--line:#303030;--field:#121212;--fieldline:#303030;
  --shadow:rgba(0,0,0,.5);--btn:#272727;--btnfg:#f1f1f1;--sub:#f1f1f1;--subfg:#0f0f0f;
  --brand:#f03;--skel:#272727;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:14px;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:var(--fieldline);border-radius:9px}

/* ---------- top bar ---------- */
.top{height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;
  position:sticky;top:0;background:var(--bg);z-index:20}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  flex:0 0 auto}
.icon:hover{background:var(--hover)}
.icon svg{width:24px;height:24px;fill:currentColor}
.brand{display:flex;align-items:center;gap:5px;margin-right:12px;cursor:pointer;
  flex:0 0 auto}
.brand .mark{width:29px;height:20px;border-radius:5px;background:var(--brand);
  display:grid;place-items:center}
.brand .mark::after{content:"";border-left:8px solid #fff;border-top:5px solid transparent;
  border-bottom:5px solid transparent;margin-left:2px}
.brand .word{font-size:19px;font-weight:700;letter-spacing:-.5px}
.brand sup{font-size:9px;color:var(--fg2);font-weight:400}

.searchwrap{flex:1 1 auto;display:flex;justify-content:center;gap:8px;min-width:0}
.search{display:flex;max-width:560px;flex:1 1 auto;min-width:0}
.search input{flex:1 1 auto;min-width:0;height:40px;padding:0 16px;font:inherit;
  border:1px solid var(--fieldline);border-right:0;border-radius:20px 0 0 20px;
  background:var(--field);color:var(--fg);outline:none}
.search input:focus{border-color:#065fd4}
.search button{width:64px;border:1px solid var(--fieldline);border-left:0;
  border-radius:0 20px 20px 0;background:var(--chip);display:grid;place-items:center}
.search button svg{width:22px;height:22px;fill:currentColor}
.mic{width:40px;height:40px;border-radius:50%;background:var(--chip);
  display:grid;place-items:center;flex:0 0 auto}
.mic:hover{background:var(--hover)}
.mic svg{width:20px;height:20px;fill:currentColor}

.right{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.create{display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;
  border-radius:18px;background:var(--chip);font-size:14px;font-weight:500}
.create:hover{background:var(--hover)}
.create svg{width:19px;height:19px;fill:currentColor}
.bell{position:relative}
.bell .n{position:absolute;top:3px;right:2px;background:var(--brand);color:#fff;
  font-size:10px;line-height:1;padding:2px 4px;border-radius:8px;font-weight:500}
.me{width:32px;height:32px;border-radius:50%;background:#0BD97F;color:#06120B;
  display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 auto;
  cursor:pointer}

/* ---------- shell ---------- */
.shell{height:calc(100% - 56px);display:grid;grid-template-columns:240px 1fr;
  overflow:hidden}
/* Single column, not "0 1fr". Hiding .side with display:none removes it from
   the grid, so .main becomes the first item and would land in the 0 track
   while the 1fr track sat empty — a zero-width page that still reports no
   overflow. */
.shell.mini{grid-template-columns:1fr}
.side{overflow-y:auto;padding:0 12px 24px;border-right:0}
.shell.mini .side{display:none}
.snav{display:flex;align-items:center;gap:24px;height:40px;padding:0 12px;
  border-radius:10px;width:100%;text-align:left;font-size:14px}
.snav:hover{background:var(--hover)}
.snav[aria-current="true"]{background:var(--hover);font-weight:500}
.snav svg{width:23px;height:23px;fill:currentColor;flex:0 0 auto}
.snav .av{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:grid;
  place-items:center;color:#fff;font-size:11px;font-weight:700}
.snav .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#065fd4}
.sgroup{border-top:1px solid var(--line);padding:12px 0;margin-top:6px}
.sgroup:first-child{border-top:0;margin-top:0}
.stitle{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:16px;
  font-weight:500}
.stitle svg{width:16px;height:16px;fill:currentColor}

.main{overflow-y:auto;padding:0 24px 40px}

/* ---------- chips ---------- */
.chips{position:sticky;top:0;background:var(--bg);display:flex;gap:12px;
  padding:12px 0;overflow-x:auto;scrollbar-width:none;z-index:10}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:32px;padding:0 12px;border-radius:8px;background:var(--chip);
  font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sub);color:var(--subfg)}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px 16px;padding-top:8px}
.card{text-align:left;display:block;width:100%}
.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;
  background:var(--skel);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{width:100%;height:100%;display:grid;place-items:center;gap:6px;
  align-content:center;text-align:center;padding:14px;
  background:linear-gradient(135deg,#111827,#1f2937)}
.thumb .ph b{color:#0BD97F;font-size:28px;font-weight:800;letter-spacing:-.02em}
.thumb .ph span{color:#9aa5b2;font-size:11px}
.thumb .len{position:absolute;right:6px;bottom:6px;background:#000c;color:#fff;
  font-size:12px;font-weight:500;padding:1px 4px;border-radius:4px;z-index:3}
/* Two preview layers. The flipbook of storyboard frames covers the player
   while YouTube's title card and centre button are still showing — those take
   over 5s to fade and the centre one cannot be cropped away. Once they are
   gone the real video crossfades in underneath.
   pointer-events:none on both is load-bearing: without it the overlay
   swallows the click that opens the video. */
.thumb .prev{position:absolute;inset:0;width:100%;height:100%;border:0;
  background:#000;pointer-events:none;z-index:1;opacity:0;transition:opacity .45s}
.thumb .prev.on{opacity:1}
.thumb .flip{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  pointer-events:none;z-index:2;transition:opacity .45s}
.thumb .flip.off{opacity:0}
.cardbody{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:12px 0 0}
.cav{width:36px;height:36px;border-radius:50%;background:#0BD97F;color:#06120B;
  display:grid;place-items:center;font-weight:700}
.card h3{margin:0 0 4px;font-size:16px;line-height:1.4;font-weight:500;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{color:var(--fg2);font-size:14px;line-height:1.5}

/* ---------- watch ---------- */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 402px;gap:24px;padding-top:24px}
.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player iframe{width:100%;height:100%;border:0;display:block}
.player .ph{width:100%;height:100%;display:grid;place-content:center;gap:10px;
  text-align:center;padding:24px;background:linear-gradient(135deg,#111827,#1f2937)}
.player .ph b{color:#0BD97F;font-size:17px}
.player .ph span{color:#9aa5b2;font-size:13px;max-width:46ch;line-height:1.6}
.wtitle{font-size:20px;font-weight:700;line-height:1.4;margin:12px 0 0}
.owner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}
.owner .cav{width:40px;height:40px}
.oname{font-size:16px;font-weight:500;line-height:1.3}
.osub{color:var(--fg2);font-size:12px}
.subscribe{height:36px;padding:0 16px;border-radius:18px;background:var(--sub);
  color:var(--subfg);font-weight:500}
.acts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.act{height:36px;padding:0 14px;border-radius:18px;background:var(--btn);
  color:var(--btnfg);font-weight:500;display:flex;align-items:center;gap:7px}
.act:hover{filter:brightness(.94)}
.act svg{width:19px;height:19px;fill:currentColor}
.act .sep{width:1px;height:22px;background:var(--fieldline);margin:0 2px}
.desc{background:var(--chip);border-radius:12px;padding:12px;font-size:14px;
  line-height:1.5;white-space:pre-wrap}
.desc .dm{font-weight:500;margin-bottom:6px}
.cmts{margin-top:24px}
.cmthead{display:flex;align-items:center;gap:24px;font-size:20px;font-weight:700;
  margin-bottom:20px}
.cmtbox{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:center}
.cmtbox .cav{width:40px;height:40px}
.cmtbox input{width:100%;height:34px;background:transparent;border:0;
  border-bottom:1px solid var(--fieldline);color:var(--fg);font:inherit;outline:none}
.cmt{display:grid;grid-template-columns:40px 1fr;gap:14px;margin-top:22px}
.cmt .cav{width:40px;height:40px}
.pin{display:inline-block;font-size:12px;color:var(--fg2);margin-bottom:4px}
.cmt .who{font-size:13px;font-weight:500;margin-bottom:3px}
.cmt .who span{color:var(--fg2);font-weight:400;margin-left:6px}
.cmt .body{font-size:14px;line-height:1.5;white-space:pre-wrap}

.rail{display:flex;flex-direction:column;gap:8px}
.rcard{display:grid;grid-template-columns:168px 1fr;gap:8px;text-align:left;
  border-radius:10px;padding:2px}
.rcard:hover{background:var(--hover)}
.rcard .thumb{border-radius:8px}
.rcard h4{margin:0 0 4px;font-size:14px;line-height:1.35;font-weight:500;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard .meta{color:var(--fg2);font-size:12px;line-height:1.5}

/* Narrow: the rail becomes a drawer over the content, the way YouTube does it.
   Without this the hamburger has nothing to toggle and reads as broken. */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25;opacity:0;
  pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}

@media(max-width:1100px){
  .watch{grid-template-columns:1fr}
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .shell.drawer .side{display:block;position:fixed;top:56px;left:0;bottom:0;
    width:240px;padding-top:8px;background:var(--bg);z-index:30;
    box-shadow:0 0 24px var(--shadow)}
}
@media(min-width:1101px){.scrim{display:none}}
@media(max-width:760px){
  .top{padding:0 8px;gap:4px}
  .main{padding:0 12px 32px}
  .searchwrap .mic,.create span,.brand sup,.bell{display:none}
  .brand{margin-right:4px}
  .brand .word{font-size:16px}
  .grid{grid-template-columns:1fr}
  .acts{margin-left:0}
}
/* Below this the bar cannot hold both a wordmark and a search field, so the
   field goes — same call YouTube makes, for the same reason. */
@media(max-width:560px){
  .searchwrap,.create{display:none}
  .rcard{grid-template-columns:148px 1fr}
}
</style>
</head>

  music:'M12 4v9.17A4 4 0 1 0 14 17V8h5V4h-7z',
  game:'M10 12H8v2H6v-2H4v-2h2V8h2v2h2v2zm5 1a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm3 2a1 1 0 1 1 0-2 1 1 0 0 1 0 2zM17 5H7a5 5 0 0 0 0 10h10a5 5 0 0 0 0-10z',
  trophy:'M19 5h-2V3H7v2H5a2 2 0 0 0-2 2v2a4 4 0 0 0 4 4 5 5 0 0 0 4 3v2H8v2h8v-2h-3v-2a5 5 0 0 0 4-3 4 4 0 0 0 4-4V7a2 2 0 0 0-2-2z',
};
const svg = d => `<svg viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const CHANNELS = [
  ['Query Plan', '#e64a19'], ['The Refactor', '#1e88e5'], ['Latency', '#8e24aa'],
  ['Cache Invalidation', '#00897b'], ['Off By One', '#f9a825'], ['Stack Trace', '#5e35b1'],
];
function nav(icon, label, opts = {}) {
  const b = document.createElement('button');
  b.className = 'snav';
  b.innerHTML = (opts.av
      ? `<span class="av" style="background:${opts.av}">${label[0]}</span>`
      : svg(icon))
    + `<span>${label}</span>` + (opts.dot ? '<span class="dot"></span>' : '');
  if (opts.current) b.setAttribute('aria-current', 'true');
  b.addEventListener('click', () => { closeDrawer(); (opts.on || (() => go('home')))(); });
  return b;
}
function group(title, items) {
  const g = document.createElement('div');
  g.className = 'sgroup';
  if (title) {
    const t = document.createElement('div');
    t.className = 'stitle';
    t.innerHTML = `${title}<svg viewBox="0 0 24 24"><path d="M9.4 6 8 7.4l4.6 4.6L8 16.6 9.4 18l6-6z"/></svg>`;
    g.append(t);
  }
  items.forEach(i => g.append(i));
  return g;
}
function buildSide(view) {
  side.replaceChildren(
    group('', [
      nav(I.home, 'Home', { current: view === 'home', on: () => go('home') }),
      nav(I.shorts, 'Shorts'),
      nav(I.subs, 'Subscriptions'),
    ]),
    group('Subscriptions',
      CHANNELS.map(([n, c], i) => nav('', n, { av: c, dot: i < 3 }))),
    group('You', [
      nav(I.you, 'Your channel'), nav(I.history, 'History'),
      nav(I.list, 'Playlists'), nav(I.clock, 'Watch later'),
      nav(I.like, 'Liked videos'), nav(I.play, 'Your videos'),
    ]),
    group('Explore', [
      nav(I.music, 'Music'), nav(I.game, 'Gaming'), nav(I.trophy, 'Sports'),
    ]),
  );
}
/* Wide: the rail collapses in place. Narrow: it slides over as a drawer. */
const scrim = $('scrim');
const narrow = () => matchMedia('(max-width:1100px)').matches;
const closeDrawer = () => {
  shell.classList.remove('drawer');
  scrim.classList.remove('on');
};
$('burger').addEventListener('click', () => {
  if (!narrow()) { shell.classList.toggle('mini'); return; }
  const open = shell.classList.toggle('drawer');
  scrim.classList.toggle('on', open);
});
scrim.addEventListener('click', closeDrawer);
addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
// Leaving the drawer open behind a route change strands the scrim over content.
addEventListener('resize', () => { if (!narrow()) closeDrawer(); });

/* ---------- pieces ---------- */
// maxresdefault is true 16:9. hqdefault is 4:3 and letterboxes a widescreen
// video with black bars, so it is only the fallback for the odd upload that
// never got a maxres frame generated.
const thumb = (v, n) => v.id
  ? `<img loading="lazy" alt="" src="https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/maxresdefault.jpg"
       onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/hqdefault.jpg'">`
  : `<div class="ph"><b>0${n + 1}</b><span>no video attached yet</span></div>`;

// "1 view" is true, and truer than any number I could put here.
const views = () => '1 view';

/* Hover preview. Two stages, because the obvious single-stage version shows
   YouTube's title card, channel avatar and centre pause button for the first
   five seconds — measured, not assumed — and the centre one sits too near the
   middle to crop out.
     400ms   flipbook of YouTube's own storyboard frames (25/50/75% through
             the video, ~13KB each). Motion immediately, no player chrome.
     1200ms  muted player starts loading underneath, invisible.
     5200ms  its chrome has faded, so crossfade to the real video.
   Skipped on touch, where there is no hover. */
const CAN_HOVER = matchMedia('(hover: hover) and (pointer: fine)').matches;
const FLIP_AT = 400, FRAME_AT = 1200, REVEAL_AT = 5200, FLIP_EVERY = 700;

function preview(thumb, v) {
  if (!CAN_HOVER || !v.id) return;
  const id = encodeURIComponent(v.id);
  const frames = ['hq1', 'hq2', 'hq3'].map(n => `https://i.ytimg.com/vi/${id}/${n}.jpg`);
  const timers = [];
  let flip = null, frame = null, cycle = null;

  const stop = () => {
    timers.splice(0).forEach(clearTimeout);
    clearInterval(cycle); cycle = null;
    flip?.remove(); flip = null;
    frame?.remove(); frame = null;
  };

  thumb.addEventListener('mouseenter', () => {
    stop();
    frames.forEach(src => { new Image().src = src; });   // warm the cache

    timers.push(setTimeout(() => {
      let n = 0;
      flip = document.createElement('img');
      flip.className = 'flip';
      flip.alt = '';
      flip.src = frames[0];
      thumb.append(flip);
      cycle = setInterval(() => {
        n = (n + 1) % frames.length;
        if (flip) flip.src = frames[n];
      }, FLIP_EVERY);
    }, FLIP_AT));

    timers.push(setTimeout(() => {
      frame = document.createElement('iframe');
      frame.className = 'prev';
      frame.tabIndex = -1;
      frame.setAttribute('aria-hidden', 'true');
      frame.allow = 'autoplay; encrypted-media';
      frame.src = `https://www.youtube-nocookie.com/embed/${id}`
        + '?autoplay=1&mute=1&controls=0&disablekb=1&modestbranding=1'
        + '&playsinline=1&rel=0&start=3';
      thumb.append(frame);
    }, FRAME_AT));

    timers.push(setTimeout(() => {
      if (!frame) return;
      frame.classList.add('on');
      flip?.classList.add('off');
      clearInterval(cycle); cycle = null;
    }, REVEAL_AT));
  });

  thumb.addEventListener('mouseleave', stop);
}

function card(v, i) {
  const b = document.createElement('button');
  b.className = 'card';
  b.innerHTML = `
    <div class="thumb">${thumb(v, i)}<span class="len">${v.len}</span></div>
    <div class="cardbody">
      <span class="cav">${CH.initial}</span>
      <div><h3></h3><div class="meta"></div></div>
    </div>`;
  b.querySelector('h3').textContent = v.title;
  b.querySelector('.meta').innerHTML =
    `${CH.name}<br>${views()} · ${v.when}`;
  preview(b.querySelector('.thumb'), v);
  b.addEventListener('click', () => go('watch', i, true));
  return b;
}

// Derived from the videos, so a chip can never filter down to an empty grid.
const CHIPS = ['All', ...new Set(VIDEOS.map(v => v.tag).filter(Boolean))];
let chip = 'All', query = '';

function home() {
  shell.classList.remove('mini');   // rail comes back on the grid
  buildSide('home');
  const wrap = document.createElement('div');

  const chips = document.createElement('div');
  chips.className = 'chips';
  CHIPS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = c;
    b.setAttribute('aria-pressed', String(c === chip));
    b.addEventListener('click', () => { chip = c; render(); });
    chips.append(b);
  });

  const grid = document.createElement('div');
  grid.className = 'grid';
  const q = query.trim().toLowerCase();
  const shown = VIDEOS
    .map((v, i) => [v, i])
    .filter(([v]) => (chip === 'All' || v.tag === chip)
      && (!q || (v.title + ' ' + v.desc).toLowerCase().includes(q)));

  if (!shown.length) {
    const e = document.createElement('div');
    e.style.cssText = 'padding:48px 0;color:var(--fg2)';
    e.textContent = 'No videos match that.';
    grid.append(e);
  }
  shown.forEach(([v, i]) => grid.append(card(v, i)));

  wrap.append(chips, grid);
  main.replaceChildren(wrap);
  main.scrollTop = 0;
}

function watch(i, autoplay = false) {
  // Collapse the rail on entering a video, the way YouTube does — the player
  // picks up the full 240px immediately instead of after a second click.
  shell.classList.add('mini');
  buildSide('watch');
  const v = VIDEOS[i];
  const wrap = document.createElement('div');
  wrap.className = 'watch';

  // autoplay only when a click brought us here. On first load — including a
  // ?v= deep link — sound nobody asked for is hostile, and this page is
  // embedded in someone else's, which makes it worse.
  const left = document.createElement('div');
  left.innerHTML = `
    <div class="player">${v.id
      ? `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?rel=0&playsinline=1${autoplay ? '&autoplay=1' : ''}"
                allow="autoplay; accelerometer; clipboard-write; encrypted-media; picture-in-picture"
                allowfullscreen title=""></iframe>`
      : `<div class="ph"><b>no video attached yet</b>
           <span>Add the YouTube ID to this entry in the JSON block near the bottom
           of watch/index.html and it plays right here.</span></div>`}</div>
    <h1 class="wtitle"></h1>
    <div class="owner">
      <span class="cav">${CH.initial}</span>
      <div><div class="oname">${CH.name}</div><div class="osub">${CH.handle}</div></div>
      <button class="subscribe">Subscribe</button>
      <div class="acts">
        <button class="act">${svg(I.like)} 1<span class="sep"></span>
          <svg viewBox="0 0 24 24" style="transform:rotate(180deg)"><path d="${I.like}"/></svg></button>
        <button class="act">Share</button>
        <button class="act">Save</button>
      </div>
    </div>
    <div class="desc"><div class="dm">${views()} · ${v.when}</div><span></span></div>
    <div class="cmts">
      <div class="cmthead">1 Comment</div>
      <div class="cmtbox"><span class="cav">${CH.initial}</span>
        <input placeholder="Add a comment…"></div>
      <div class="cmt">
        <span class="cav">${CH.initial}</span>
        <div>
          <span class="pin">📌 Pinned by ${CH.name}</span>
          <div class="who">${CH.name} <span>${v.when}</span></div>
          <div class="body">Yes, this whole player is hand-built — one HTML file, no framework, no build step. The videos are real; the interface around them is a deliberate knock-off, written from scratch because a CV felt like the boring option.</div>
        </div>
      </div>
    </div>`;
  left.querySelector('.wtitle').textContent = v.title;
  left.querySelector('.desc span').textContent = v.desc;

  const rail = document.createElement('div');
  rail.className = 'rail';
  VIDEOS.forEach((o, n) => {
    if (n === i) return;
    const b = document.createElement('button');
    b.className = 'rcard';
    b.innerHTML = `
      <div class="thumb">${thumb(o, n)}<span class="len">${o.len}</span></div>
      <div><h4></h4><div class="meta">${CH.name}<br>${views()} · ${o.when}</div></div>`;
    b.querySelector('h4').textContent = o.title;
    preview(b.querySelector('.thumb'), o);
    b.addEventListener('click', () => go('watch', n, true));
    rail.append(b);
  });

  wrap.append(left, rail);
  main.replaceChildren(wrap);
  main.scrollTop = 0;
}

/* ---------- routing: ?v=2 deep-links one video ---------- */
function go(view, i = 0, autoplay = false) {
  closeDrawer();
  if (view === 'watch') {
    history.replaceState(null, '', `?v=${i + 1}`);
    watch(i, autoplay);
  } else {
    history.replaceState(null, '', location.pathname);
    home();
  }
}
function render() {
  const n = parseInt(new URLSearchParams(location.search).get('v'), 10);
  if (Number.isInteger(n) && n >= 1 && n <= VIDEOS.length) watch(n - 1);
  else home();
}

$('home-link').addEventListener('click', () => go('home'));
$('searchform').addEventListener('submit', e => {
  e.preventDefault();
  query = $('q').value;
  go('home');
});

render();
</script>
</body>
</html>
